<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1890ff"/>
      <stop offset="100%" stop-color="#096dd9"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- 外齿轮 -->
  <g transform="translate(100,100)" fill="url(#gearGrad)">
    <path d="
      M 0,-60
      L 8,-55 L 18,-58 L 24,-50
      L 34,-52 L 40,-44 L 50,-44 L 54,-35
      L 64,-33 L 66,-24 L 75,-20 L 75,-10
      L 84,-5 L 82,5 L 90,12 L 85,20
      L 92,28 L 86,36 L 90,45 L 82,52
      L 84,62 L 75,66 L 72,75 L 62,76
      L 56,84 L 46,82 L 38,90 L 28,86
      L 18,92 L 10,86 L 0,90
      L -10,86 L -18,92 L -28,86
      L -38,90 L -46,82 L -56,84
      L -62,76 L -72,75 L -75,66
      L -84,62 L -82,52 L -90,45
      L -86,36 L -92,28 L -85,20
      L -90,12 L -82,5 L -84,-5
      L -75,-10 L -75,-20 L -66,-24
      L -64,-33 L -54,-35 L -50,-44
      L -40,-44 L -34,-52 L -24,-50
      L -18,-58 L -8,-55 Z
    "/>
  </g>

  <!-- 内齿轮/设备图标 -->
  <g transform="translate(100,100)">
    <circle cx="0" cy="0" r="28" fill="#1890ff"/>
    <path d="M -16,-6 L 16,-6 L 22,8 L -22,8 Z" fill="#ffffff" opacity="0.9"/>
    <rect x="-4" y="-18" width="8" height="12" rx="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="14" r="5" fill="#ffffff" opacity="0.9"/>
    <path d="M 18,10 L 30,18 L 26,24 L 14,16 Z" fill="#52c41a" opacity="0.95"/>
  </g>

  <!-- 底部装饰线 -->
  <path d="M 60,155 Q 100,170 140,155" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
</svg>
